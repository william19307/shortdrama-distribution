services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortform
      POSTGRES_PASSWORD: shortform
      POSTGRES_DB: shortform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortform -d shortform"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123456; do sleep 1; done;
      mc mb -p local/shortform || true;
      mc anonymous set-json /cors.json local/shortform || mc cors set local/shortform /cors.json || true;
      "
    volumes:
      - ./docker/minio-cors.json:/cors.json:ro

volumes:
  pgdata:
  minio:
